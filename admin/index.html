<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin moved — Arbitara</title>
<!-- The standalone admin page has been folded into the live site: sign in
     with the lock icon (top right) and everything — inline editing, gated
     content, site settings, contacts — is there. This stub just forwards
     old bookmarks to the homepage. -->
<meta http-equiv="refresh" content="3; url=/">
<style>
  :root{ --paper:#FAF7F1; --ink:#191712; --muted:#6C6558; --accent-ink:#836417;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif; }
  @media (prefers-color-scheme: dark){:root{ --paper:#14130F; --ink:#F2ECE0; --muted:#A79F8E; --accent-ink:#D8B255; }}
  html,body{height:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.6;}
  .box{max-width:440px;}
  h1{font-family:var(--serif);font-size:24px;margin:0 0 12px;}
  p{color:var(--muted);font-size:15px;margin:0 0 10px;}
  a{color:var(--accent-ink);font-weight:600;}
</style>
</head>
<body>
  <div class="box">
    <h1>Admin is built into the site now</h1>
    <p>Sign in with the lock icon at the top right of any page. Inline editing,
       gated content, site settings and contacts all live there.</p>
    <p>Taking you to the <a href="/">homepage</a>…</p>
  </div>
</body>
</html>
