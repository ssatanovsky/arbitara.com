# =============================================================================
# Decap CMS configuration for arbitara.com
#
# Logging in uses GitHub. Because GitHub Pages is static, the OAuth handshake
# needs a tiny external helper. After you deploy one (see DEPLOY-ADMIN.md),
# put its URL in `base_url` below. Until then, you can edit locally:
#   1) npm i -g decap-server   (or: npx decap-server)
#   2) run `decap-server` in the project folder
#   3) set `local_backend: true` (already set) and open http://localhost:8080/admin/
# =============================================================================

backend:
  name: github
  repo: ssatanovsky/arbitara.com      # owner/repo of the live site
  branch: main
  # base_url: https://REPLACE-WITH-YOUR-OAUTH-PROXY   # <-- set after deploying the proxy

# Lets you run the CMS against your local working copy with `decap-server`
# (no GitHub login needed). Harmless in production — it is only used when a
# local decap-server is detected.
local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: settings
    label: "Site settings"
    delete: false
    editor:
      preview: false
    files:
      - name: content
        label: "Content switches"
        file: "config.json"
        format: json
        description: >
          Turn parts of arbitara.com on and off. Changes go live about a minute
          after you save (GitHub rebuilds the site).
        fields:
          - label: "Password protection (whole site)"
            name: password
            widget: object
            collapsed: false
            fields:
              - { label: "Enabled — require a password to view the site", name: enabled, widget: boolean, default: false }
              - { label: "Heading", name: heading, widget: string, required: false }
              - { label: "Text", name: text, widget: string, required: false }
              - { label: "Password hash (SHA-256 — ask me to regenerate when changing the password)", name: hash, widget: string, required: false }

          - label: "Coming-soon mode"
            name: comingSoon
            widget: object
            collapsed: false
            fields:
              - { label: "Enabled — hide the whole site behind a holding page", name: enabled, widget: boolean, default: false }
              - { label: "Heading", name: heading, widget: string, required: false }
              - { label: "Text", name: text, widget: text, required: false }

          - label: "Announcement banner"
            name: banner
            widget: object
            collapsed: false
            fields:
              - { label: "Enabled — show a bar at the top of every page", name: enabled, widget: boolean, default: false }
              - { label: "Text (basic HTML links allowed)", name: text, widget: string, required: false }

          - label: "Practitioner tools — access gate"
            name: gate
            widget: object
            collapsed: false
            fields:
              - { label: "Gate enabled — tools require a waitlist signup to unlock", name: enabled, widget: boolean, default: true }

          - label: "Individual tools"
            name: tools
            widget: object
            collapsed: false
            fields:
              - { label: "Pre-decision checklist", name: checklist, widget: boolean, default: true }
              - { label: "Tier diagnostic", name: diagnostic, widget: boolean, default: true }
              - { label: "One-page decision record", name: record, widget: boolean, default: true }

          - label: "Page sections"
            name: sections
            widget: object
            collapsed: false
            fields:
              - { label: "The Gap", name: disappear, widget: boolean, default: true }
              - { label: "Anatomy of a decision", name: anatomy, widget: boolean, default: true }
              - { label: "The Process (12 steps)", name: process, widget: boolean, default: true }
              - { label: "The three Tiers", name: tiers, widget: boolean, default: true }
              - { label: "Bias & Noise", name: bias, widget: boolean, default: true }
              - { label: "AI & Ownership", name: ai, widget: boolean, default: true }
              - { label: "The Decision Object", name: object, widget: boolean, default: true }
              - { label: "Seven Principles", name: principles, widget: boolean, default: true }
              - { label: "Toolkit", name: toolkit, widget: boolean, default: true }
